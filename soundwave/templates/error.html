{% extends "base.html" %}
{% block title %}{{ code }} — Cadence{% endblock %}
{% block content %}
<div class="empty-state error-state">
  <div class="error-code">{{ code }}</div>
  <p>{{ message }}</p>
  <a href="{{ url_for('index') }}" class="btn-primary">Back to Cadence</a>
</div>
{% endblock %}
{% block auth_content %}
<div class="empty-state error-state" style="margin: 10vh auto;">
  <div class="error-code">{{ code }}</div>
  <p>{{ message }}</p>
  <a href="{{ url_for('login') }}" class="btn-primary">Back to Cadence</a>
</div>
{% endblock %}
